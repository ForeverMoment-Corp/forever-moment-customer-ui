<!doctype html>
<html lang="en-IN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forever Moment | India's #1 Celebration Platform</title>

  <!-- SEO defaults for crawlers that do not run JavaScript; src/lib/seo.ts updates them per page. -->
  <meta name="description" content="Book birthday decorations, anniversary surprises, candlelight dinners and more, set up at your venue by verified vendors. Transparent pricing and 24/7 support." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#8C2B32" />
  <link rel="canonical" href="%VITE_SITE_URL%/" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Link previews (WhatsApp, Facebook, LinkedIn, X) -->
  <meta property="og:site_name" content="Forever Moment" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:title" content="Forever Moment | India's #1 Celebration Platform" />
  <meta property="og:description" content="Book birthday decorations, anniversary surprises, candlelight dinners and more, set up at your venue by verified vendors." />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Forever Moment | India's #1 Celebration Platform" />
  <meta name="twitter:description" content="Book birthday decorations, anniversary surprises, candlelight dinners and more, set up at your venue by verified vendors." />
  <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

  <!-- Who we are, for search engines (no phone number until the real one is set in contact.ts) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "%VITE_SITE_URL%/#organization",
          "name": "Forever Moment",
          "url": "%VITE_SITE_URL%/",
          "logo": "%VITE_SITE_URL%/logo.png",
          "email": "support@forevermoment.com"
        },
        {
          "@type": "WebSite",
          "@id": "%VITE_SITE_URL%/#website",
          "name": "Forever Moment",
          "url": "%VITE_SITE_URL%/",
          "inLanguage": "en-IN",
          "publisher": { "@id": "%VITE_SITE_URL%/#organization" }
        }
      ]
    }
  </script>

  <!-- Google Fonts - Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Image CDN - open the connection early so the first photos start sooner -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="dns-prefetch" href="https://images.unsplash.com">
  <!-- First hero slide: start downloading before any JavaScript runs (candidates match SmartImage's srcset) -->
  <link rel="preload" as="image" fetchpriority="high" imagesizes="100vw" imagesrcset="https://images.unsplash.com/photo-1519741497674-611481863552?w=320&auto=format&fit=crop&q=75 320w, https://images.unsplash.com/photo-1519741497674-611481863552?w=480&auto=format&fit=crop&q=75 480w, https://images.unsplash.com/photo-1519741497674-611481863552?w=640&auto=format&fit=crop&q=75 640w, https://images.unsplash.com/photo-1519741497674-611481863552?w=800&auto=format&fit=crop&q=75 800w, https://images.unsplash.com/photo-1519741497674-611481863552?w=1080&auto=format&fit=crop&q=75 1080w, https://images.unsplash.com/photo-1519741497674-611481863552?w=1400&auto=format&fit=crop&q=75 1400w">

  <!-- First-paint splash (replaced by React as soon as the app renders). Colours fall back to the
       default "blush" theme because the stylesheet may not have loaded yet. Same look as LogoLoader.tsx. -->
  <link rel="preload" as="image" href="/logo-mark.webp" type="image/webp" fetchpriority="high">
  <style>
    .fm-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: var(--cream, #fdf3f2); }
    .fm-splash img { width: 128px; height: auto; animation: fm-breathe 1.6s ease-in-out infinite; }
    .fm-splash span { position: relative; display: block; width: 96px; height: 2px; overflow: hidden; border-radius: 9999px; background: color-mix(in srgb, var(--gold-light, #f1c6d2) 40%, transparent); }
    .fm-splash span::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 9999px; background: var(--gold, #b4466b); animation: fm-bar 1.2s ease-in-out infinite; }
    @keyframes fm-breathe { 0%, 100% { transform: scale(0.96); opacity: 0.75; } 50% { transform: scale(1); opacity: 1; } }
    @keyframes fm-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .fm-splash img, .fm-splash span::after { animation: none; } }
  </style>

  <!-- Google Fonts - Cormorant Garamond and Jost -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root">
    <div class="fm-splash" role="status" aria-label="Loading Forever Moment">
      <img src="/logo-mark.webp" alt="" width="320" height="162">
      <span></span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
